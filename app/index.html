<meta charset="utf-8">
<title>Comida App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Estilo «Sereno» (D15). Colores, radios y sombras salen siempre de estas variables:
   los dos temas funcionan cambiando solo las variables. */
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#EFEBE1; --field:#FBFAF6;
  --line:#E8E3D8; --line-2:#E2DDD1; --line-dash:#D9D3C5;
  --ink:#1F2A26; --ink-2:#5E6A64; --ink-3:#8A948F; --ink-label:#3E4A45;
  --accent:#2E5E4E; --accent-ink:#FFFFFF; --accent-soft:#E3EEEA;
  --after:#B8642A; --after-edge:#C9824A; --after-ink:#9A5626; --after-soft:#FBEFE4;
  --warn-ink:#8A5A0F; --warn-soft:#F7ECD2;
  --danger:#A23B32;
  --heat-0:#EFEBE1; --heat-1:#D6E6DE; --heat-2:#A9CBBE; --heat-3:#6FA592; --heat-4:#2E5E4E;
  --t-desayuno:#C98A1B;     --t-desayuno-s:#F8EBCF;     --t-desayuno-i:#8A5A0F;
  --t-media_manana:#6F9136; --t-media_manana-s:#E8F0D8; --t-media_manana-i:#4D6B1F;
  --t-comida:#2F8A6E;       --t-comida-s:#DCEFE7;       --t-comida-i:#1F6B54;
  --t-merienda:#C8614B;     --t-merienda-s:#F7E0DA;     --t-merienda-i:#9C4130;
  --t-cena:#4B5BA8;         --t-cena-s:#E2E5F4;         --t-cena-i:#3A4890;
  --t-picoteo:#8A6FA8;      --t-picoteo-s:#EEE7F5;      --t-picoteo-i:#6E5690;
  --card-shadow:none; --raised-shadow:0 8px 24px rgba(31,42,38,.07);
  --bar-shadow:0 12px 30px rgba(31,42,38,.14);
  /* lo que cambia entre temas sin ser un color de la paleta (§7.3) */
  --on-color:#FFFFFF; --seg-on:var(--surface); --heat-ink-3:#FFFFFF; --heat-ink-4:#FFFFFF;
  --f-display:"Fraunces", ui-serif, Georgia, serif;
  --f-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141A17; --surface:#1C2420; --surface-2:#242E29; --field:#18201C;
    --line:#2E3833; --line-2:#34403A; --line-dash:#3D4A44;
    --ink:#EDEFEA; --ink-2:#A9B3AD; --ink-3:#7E8984; --ink-label:#C5CDC8;
    --accent:#86C2AC; --accent-ink:#10201A; --accent-soft:#1F3A31;
    --after:#E3A06E; --after-edge:#C9824A; --after-ink:#F0B88C; --after-soft:#3A2A1E;
    --warn-ink:#E6C06A; --warn-soft:#3A3018; --danger:#E0786E;
    --heat-0:#242E29; --heat-1:#23433A; --heat-2:#2F6152; --heat-3:#4A8D78; --heat-4:#86C2AC;
    --t-desayuno:#E8B04A;     --t-desayuno-s:#3A3222;     --t-desayuno-i:#E8B04A;
    --t-media_manana:#A5C46A; --t-media_manana-s:#2E3824; --t-media_manana-i:#A5C46A;
    --t-comida:#5CC2A0;       --t-comida-s:#1F3A31;       --t-comida-i:#5CC2A0;
    --t-merienda:#EE8D75;     --t-merienda-s:#3D2A26;     --t-merienda-i:#EE8D75;
    --t-cena:#9AA6E8;         --t-cena-s:#2A2F45;         --t-cena-i:#9AA6E8;
    --t-picoteo:#C2A6E0;      --t-picoteo-s:#33293F;      --t-picoteo-i:#C2A6E0;
    --raised-shadow:0 8px 24px rgba(0,0,0,.35); --bar-shadow:0 12px 30px rgba(0,0,0,.5);
    --on-color:var(--bg); --seg-on:var(--line-2); --heat-ink-3:var(--ink); --heat-ink-4:var(--accent-ink);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141A17; --surface:#1C2420; --surface-2:#242E29; --field:#18201C;
  --line:#2E3833; --line-2:#34403A; --line-dash:#3D4A44;
  --ink:#EDEFEA; --ink-2:#A9B3AD; --ink-3:#7E8984; --ink-label:#C5CDC8;
  --accent:#86C2AC; --accent-ink:#10201A; --accent-soft:#1F3A31;
  --after:#E3A06E; --after-edge:#C9824A; --after-ink:#F0B88C; --after-soft:#3A2A1E;
  --warn-ink:#E6C06A; --warn-soft:#3A3018; --danger:#E0786E;
  --heat-0:#242E29; --heat-1:#23433A; --heat-2:#2F6152; --heat-3:#4A8D78; --heat-4:#86C2AC;
  --t-desayuno:#E8B04A;     --t-desayuno-s:#3A3222;     --t-desayuno-i:#E8B04A;
  --t-media_manana:#A5C46A; --t-media_manana-s:#2E3824; --t-media_manana-i:#A5C46A;
  --t-comida:#5CC2A0;       --t-comida-s:#1F3A31;       --t-comida-i:#5CC2A0;
  --t-merienda:#EE8D75;     --t-merienda-s:#3D2A26;     --t-merienda-i:#EE8D75;
  --t-cena:#9AA6E8;         --t-cena-s:#2A2F45;         --t-cena-i:#9AA6E8;
  --t-picoteo:#C2A6E0;      --t-picoteo-s:#33293F;      --t-picoteo-i:#C2A6E0;
  --raised-shadow:0 8px 24px rgba(0,0,0,.35); --bar-shadow:0 12px 30px rgba(0,0,0,.5);
  --on-color:var(--bg); --seg-on:var(--line-2); --heat-ink-3:var(--ink); --heat-ink-4:var(--accent-ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t-desayuno{--t:var(--t-desayuno);--ts:var(--t-desayuno-s);--ti:var(--t-desayuno-i)}
.t-media_manana{--t:var(--t-media_manana);--ts:var(--t-media_manana-s);--ti:var(--t-media_manana-i)}
.t-comida{--t:var(--t-comida);--ts:var(--t-comida-s);--ti:var(--t-comida-i)}
.t-merienda{--t:var(--t-merienda);--ts:var(--t-merienda-s);--ti:var(--t-merienda-i)}
.t-cena{--t:var(--t-cena);--ts:var(--t-cena-s);--ti:var(--t-cena-i)}
.t-picoteo{--t:var(--t-picoteo);--ts:var(--t-picoteo-s);--ti:var(--t-picoteo-i)}

/* cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 14px}
.top .tt{min-width:0}
.top .kick{margin:0 0 2px;font-size:14px;color:var(--ink-2)}
.top h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.top .acts{display:flex;gap:8px;flex:none}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0}
.round.me{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:19px}

/* avisos */
.banner{background:var(--warn-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:grid;gap:10px}
.banner .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* botones */
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink-2);padding-inline:6px}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--bg)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}

/* control segmentado */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* Hoy: tira de la semana */
.week{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 8px 8px;touch-action:pan-y}
.wk-h{display:flex;align-items:center;gap:8px;padding:0 6px 6px}
.wk-h .n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.wk-h .r{flex:1;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink-2);font-size:18px;line-height:1}
.wk-d{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{border:0;background:transparent;border-radius:14px;padding:6px 0 7px;display:grid;justify-items:center;gap:1px;min-height:64px;min-width:0}
.wd .l{font-size:12px;color:var(--ink-3)}
.wd .d{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
.wd .pp{display:flex;gap:3px;height:5px;margin-top:3px}
.wd .pp i{width:5px;height:5px;border-radius:50%;background:var(--heat-3)}
.wd.sel{background:var(--accent);color:var(--accent-ink)}
.wd.sel .l{color:inherit;opacity:.8}
.wd.sel .pp i{background:var(--accent-ink)}
.wd.today:not(.sel){box-shadow:inset 0 0 0 2px var(--ink)}

/* Hoy: título del día */
.dayhead{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:20px 2px 14px}
.dayhead h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.dayhead .cnt{font-size:14px;color:var(--ink-2)}
.dayhead .cnt b{color:var(--warn-ink)}
.dayhead .linkbtn{margin-left:auto}

/* Hoy: línea del día */
.tl{position:relative;padding-left:46px;display:grid;gap:12px}
.tl::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:var(--line-2)}
.ti{position:relative;min-width:0}
.dot{position:absolute;left:-46px;top:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.dot .ico{width:18px;height:18px}
.dot.d-full{background:var(--t);color:var(--on-color)}
.dot.d-half{background:linear-gradient(90deg,var(--t) 50%,var(--ts) 50%);border:2px solid var(--t);color:var(--ink)}
.dot.d-gap{background:var(--bg);border:2px dashed var(--t);color:var(--t)}
.dot.sq{border-radius:10px;background:var(--bg);border:2px solid var(--accent);color:var(--accent)}
.dot.sq.on{background:var(--accent);color:var(--accent-ink)}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--card-shadow);min-width:0}
.card.open{position:relative;box-shadow:var(--raised-shadow);padding:12px 14px 14px}
.card.open .hit{position:absolute;inset:0;border:0;background:transparent;border-radius:16px;padding:0;z-index:0}
.card.open .body{position:relative;z-index:1;pointer-events:none}
.card.open .body .add{pointer-events:auto}
.chd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;white-space:nowrap}
.chd .k{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ti)}
.chd .h{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag{margin-left:auto;background:var(--warn-soft);color:var(--warn-ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.food{font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.open .food{white-space:normal;overflow-wrap:anywhere}
.food.none{font-style:italic;color:var(--ink-3)}
.cmeta{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.half{border-radius:12px;padding:8px 10px;font-size:13px;min-height:62px;min-width:0;display:grid;gap:3px;align-content:start;text-align:left}
.half h5{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.half.a{background:var(--accent-soft)} .half.a h5{color:var(--accent)}
.half.d{background:var(--after-soft)} .half.d h5{color:var(--after-ink)}
.half .emos{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.half .th{font-style:italic;color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.half .meta{color:var(--ink-2);overflow-wrap:anywhere}
.half.add{border:1.5px dashed;align-content:center;font-weight:700;font-size:14px}
.half.add.a{border-color:var(--accent);color:var(--accent)}
.half.add.d{border-color:var(--after-edge);color:var(--after-ink)}
.half.add h5{color:inherit}
.gapc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1.5px dashed var(--line-dash);background:transparent;border-radius:16px;padding:10px 12px 10px 14px;font-size:15px;color:var(--ink-2);min-height:52px}
.gapc b{color:var(--ink)}
.gapc .plus{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ts);color:var(--ti);font-weight:700;font-size:18px;line-height:1;flex:none}
.piclink{position:relative;border:0;background:transparent;padding:4px 0;margin:-4px 0;font-size:14px;font-weight:700;color:var(--t-picoteo-i);text-align:left;justify-self:start;min-height:32px}
.piclink::before{content:"";position:absolute;left:-36px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--t-picoteo);background:var(--bg);box-shadow:0 0 0 4px var(--bg)}
.card.cierre{display:flex;align-items:center;gap:12px;padding:12px 14px}
.card.cierre .tx{flex:1;min-width:0}
.card.cierre h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px}
.card.cierre small{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);flex:none}
.pill.sec{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}

/* Calendario */
.calseg{margin-bottom:14px}
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 12px 14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;text-align:center;flex:1}
.cal-nav h2 span{color:var(--ink-2);font-weight:500}
.mgrid{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:5px}
.dow,.wkn{font-size:12px;color:var(--ink-3);text-align:center;display:grid;place-items:center}
.wkn.now{color:var(--accent);font-weight:700}
.mcell{height:46px;min-width:0;border:0;border-radius:12px;background:var(--heat-0);display:grid;align-content:space-between;padding:4px 5px;text-align:left;font-variant-numeric:tabular-nums;color:var(--ink)}
.mcell b{font-size:11px;font-weight:400;opacity:.85}
.mcell strong{justify-self:end;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1}
.mcell.blank{background:transparent}
.mcell.is-today{outline:2px solid var(--ink);outline-offset:1px}
.h1{background:var(--heat-1)}.h2{background:var(--heat-2)}.h3{background:var(--heat-3);color:var(--heat-ink-3)}.h4{background:var(--heat-4);color:var(--heat-ink-4)}
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--ink-3);margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.legend .lt{margin-right:4px}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;display:grid;gap:8px;align-content:start;width:100%;min-width:0}
.ymonth header{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ymonth header b{font-family:var(--f-display);font-weight:600;font-size:15px}
.ymonth header span{font-size:12px;color:var(--ink-3)}
.ymini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;align-content:start}
.ymini i{aspect-ratio:1;min-width:0;border-radius:3px;background:var(--heat-0);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ymini i.blank{background:transparent}

/* barra flotante */
.fade{position:fixed;left:0;right:0;bottom:0;height:calc(120px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 55%);pointer-events:none;z-index:5}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 28px),532px);height:68px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--bar-shadow);z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;gap:6px}
.bar .sec{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink-2);min-height:52px;padding:4px 0}
.bar .sec[aria-current="page"]{color:var(--accent)}
.bar .reg{border:0;background:var(--accent);color:var(--accent-ink);height:48px;border-radius:999px;padding:0 20px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.bar .reg span{font-size:22px;line-height:1;margin-top:-2px}

/* hojas */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--bar-shadow)}
.sheet-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 12px;z-index:2}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .sp{width:70px}
fieldset{border:0;margin:0;padding:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:14px;margin-bottom:12px}
.block h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.block p{margin:0}
details.block{gap:0}
details.block > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:32px}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary .bd{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
details.block.despues > summary .bd{background:var(--after)}
details.block > summary h4{flex:1;font-size:17px}

<script>
(function(){
const VERSION='v0.8 · etapa 1';
const STORE='comida-app-proto-v1';
const TIPOS=[['desayuno','Desayuno'],['media_manana','Media mañana'],['comida','Comida'],['merienda','Merienda'],['cena','Cena'],['picoteo','Picoteo']];
const TIPO_LBL=Object.fromEntries(TIPOS);
const TIPO_PILL={media_manana:'M. mañana'};
const PRINCIPALES=['desayuno','media_manana','comida','merienda','cena'];

const CALIDAD=['Buena','Regular','Mala'];
/* Contadores del cierre del día: paso, primer valor al pulsar ＋ y máximo. */
const STEPS={agua:{inc:.25,start:.25,max:10,fmt:n=>fmtNum(n)+' l'},actividadHoras:{inc:.25,start:.25,max:24,fmt:n=>fmtHoras(n)},suenoHoras:{inc:.5,start:7,max:24,fmt:n=>fmtHoras(n)}};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DOW=['L','M','X','J','V','S','D'];
const POSPONER_DIAS=7; /* "Ahora no" en el aviso de copia (decidido el 27-09-2026) */

/* ---------- fechas ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x};
const diasEntre=(a,b)=>Math.round((parse(b)-parse(a))/864e5);

function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7);

const TODAY=iso(new Date());

/* ---------- estado ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
let data=load();
/* Perfil (D14): nombre y PIN. El PIN nunca se guarda en claro: sal + hash PBKDF2. */
let perfil={nombre:'',pin:null,bloqueo:'5min',fallos:0,esperaHasta:0};
try{
  const p=JSON.parse(localStorage.getItem(STORE+'-perfil')||'null');
  if(p){
    if(typeof p.nombre==='string')perfil.nombre=p.nombre;
    if(p.pin&&p.pin.salt&&p.pin.hash&&p.pin.iter)perfil.pin={salt:p.pin.salt,hash:p.pin.hash,iter:p.pin.iter};
    if(p.bloqueo==='salir')perfil.bloqueo='salir';
    perfil.fallos=Number(p.fallos)||0;perfil.esperaHasta=Number(p.esperaHasta)||0;
  }
}catch(e){}
let ui={sec:'hoy',cal:'mes',cursor:TODAY,calCursor:TODAY.slice(0,8)+'01',posponer:null};
try{const u=JSON.parse(localStorage.getItem(STORE+'-ui')||'null');if(u){if(u.sec==='cal')ui.sec='cal';if(u.cal==='ano')ui.cal='ano';if(u.posponer)ui.posponer=u.posponer;}}catch(e){}

  try{const raw=localStorage.getItem(STORE);if(raw){const d=JSON.parse(raw);if(d&&d.ingestas){normData(d);return d;}}}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){}}
function saveUi(){try{localStorage.setItem(STORE+'-ui',JSON.stringify({sec:ui.sec,cal:ui.cal,posponer:ui.posponer}));}catch(e){}}

/* Datos de ejemplo (D16): unas 6 semanas, para que Patrones se vea entero al probar.
   Los tres últimos días están escritos a mano; el resto sale de un generador con
   semilla fija, así que las cifras son siempre las mismas. */
function seed(){
  const d={ingestas:{},dias:{},ejemplos:true,etiquetasDistintas:[]};
  const t=new Date();
  const add=(off,o)=>{const id=uid();d.ingestas[id]=Object.assign(ingVacia(),{id,fecha:iso(addDays(t,off)),ejemplo:true},o);};
  add(0,{tipo:'desayuno',hora:'07:40',alimentos:'Café con leche, tostada con tomate y aceite',hambre:'Sí',lugar:'Casa',emoAntes:['Ansiedad'],pensAntes:'Voy tarde, reunión a las 9',emoDespues:['Ninguna'],pensDespues:'Mejor, más tranquilo',saciedad:'Bien',energia:'Normal'});
  add(0,{tipo:'media_manana',hora:'11:15',alimentos:'Plátano y un puñado de nueces',emoAntes:['Aburrimiento'],pensAntes:'Necesito un descanso',etiquetas:['Reunión jefe']});
  add(-1,{tipo:'desayuno',hora:'07:30',alimentos:'Yogur con avena y fruta',emoAntes:['Felicidad'],emoDespues:['Felicidad'],saciedad:'Bien',energia:'Alta'});
  add(-1,{tipo:'comida',hora:'14:20',alimentos:'Lentejas, ensalada, pan',emoAntes:['Frustración'],pensAntes:'La mañana no ha salido como quería',emoDespues:['Culpa'],pensDespues:'He comido muy rápido',saciedad:'Me he pasado',energia:'Sueño',sintomas:['Hinchazón'],etiquetas:['Trabajo en casa']});
  add(-1,{tipo:'picoteo',hora:'18:05',alimentos:'Galletas',hambre:'No',lugar:'Trabajo',emoAntes:['Aburrimiento','Ansiedad'],emoDespues:['Culpa'],saciedad:'Con hambre',energia:'Baja'});
  add(-1,{tipo:'cena',hora:'21:30',alimentos:'Tortilla francesa y verduras',emoAntes:['Ninguna'],emoDespues:['Ninguna'],saciedad:'Bien',energia:'Normal'});
  add(-2,{tipo:'desayuno',hora:'08:00',alimentos:'Café y bizcocho',emoAntes:['Ninguna'],emoDespues:['Ninguna'],energia:'Normal'});
  add(-2,{tipo:'comida',hora:'14:00',alimentos:'Arroz con pollo',emoAntes:['Felicidad'],emoDespues:['Felicidad'],saciedad:'Bien',energia:'Normal'});
  add(-2,{tipo:'cena',hora:'21:00',alimentos:'Sopa y fruta',emoAntes:['Tristeza'],pensAntes:'Día largo',emoDespues:['Tristeza'],saciedad:'Con hambre',energia:'Baja'});
  let z=20260928;
  const rnd=()=>{z=(z+0x6D2B79F5)|0;let r=Math.imul(z^z>>>15,1|z);r=r+Math.imul(r^r>>>7,61|r)^r;return ((r^r>>>14)>>>0)/4294967296;};
  const una=a=>a[Math.floor(rnd()*a.length)];
  const peso=o=>{let n=rnd()*Object.values(o).reduce((a,b)=>a+b,0);for(const [k,v] of Object.entries(o)){n-=v;if(n<0)return k;}return Object.keys(o)[0];};
  const hora=(h0,h1)=>{const m=Math.round((h0+rnd()*(h1-h0))*4)*15;return pad(Math.floor(m/60)%24)+':'+pad(m%60);};
  const COMIDAS={desayuno:['Café con leche y tostada','Yogur con avena y fruta','Café y galletas','Zumo y tostada con aceite'],
    media_manana:['Plátano','Café y una pieza de fruta','Bocadillo pequeño de jamón','Un puñado de nueces'],
    comida:['Pasta con albóndigas','Lentejas con arroz','Ensalada de atún y pan','Pollo a la plancha con patatas','Pasta vegetal','Garbanzos con espinacas','Merluza con ensalada'],
    merienda:['Yogur y fruta','Tostada con queso','Café y un bizcocho','Fruta'],
    cena:['Tortilla francesa y verduras','Sopa y fruta','Pizza','Pasta con tomate','Pescado al horno con verduras','Bocadillo y patatas fritas'],
    picoteo:['Galletas','Patatas fritas','Chocolate','Frutos secos','Pan con chorizo']};
  const HORAS={desayuno:[7.25,9],media_manana:[10.5,12],comida:[13.5,15.25],merienda:[17,18.75],cena:[20.5,22.25]};
  const DESPUES={Ansiedad:{Culpa:45,Ninguna:30,Ansiedad:25},Aburrimiento:{Culpa:35,Ninguna:50,Aburrimiento:15},Felicidad:{Felicidad:70,Ninguna:30},
    Ninguna:{Ninguna:80,Felicidad:20},Tristeza:{Tristeza:60,Ninguna:40},Frustración:{Culpa:50,Frustración:50}};
  const SAC={desayuno:{'Con hambre':30,Bien:65,'Me he pasado':5},cena:{'Con hambre':15,Bien:50,'Me he pasado':35},picoteo:{'Con hambre':30,Bien:40,'Me he pasado':30}};
  let celebracion=0;
  for(let off=-3;off>=-41;off--){
    if(rnd()<.08)continue;
    const dow=addDays(t,off).getDay(),martes=dow===2,casa=dow===5||(dow===1&&rnd()<.5),finde=dow===0||dow===6;
    const tipos=['desayuno','media_manana','comida','merienda','cena','picoteo'].filter(tp=>rnd()<({desayuno:.9,media_manana:martes?1:.5,comida:.95,merienda:.45,cena:.9,picoteo:martes||dow===4?.6:.4})[tp]);
    tipos.forEach(tp=>{
      const x={tipo:tp,alimentos:una(COMIDAS[tp])};
      x.hora=tp==='picoteo'?(rnd()<.7?hora(16.5,18.75):rnd()<.5?hora(11.5,12.5):hora(22.5,23.5)):hora(...HORAS[tp]);
      if(rnd()<.85)x.hambre=tp==='picoteo'?peso({No:60,Algo:25,'Sí':15}):peso({'Sí':55,Algo:30,No:15});
      const w={Ninguna:30,Felicidad:12,Ansiedad:10,Aburrimiento:8,Tristeza:5,Frustración:5,Rabia:2,Culpa:2,Miedo:2};
      if(martes)w.Ansiedad+=25;
      if(tp==='picoteo'){w.Aburrimiento+=12;w.Ansiedad+=8;}
      const reunion=martes&&tp==='media_manana'&&rnd()<.8;
      if(reunion){x.emoAntes=['Ansiedad'];x.hambre='No';}
      else if(rnd()<.9){const e=peso(w);x.emoAntes=[e];if(e!=='Ninguna'&&rnd()<.2){const e2=peso(Object.assign({},w,{Ninguna:0,[e]:0}));x.emoAntes.push(e2);}}
      if(rnd()<.8){
        x.emoDespues=[peso(DESPUES[(x.emoAntes||['Ninguna'])[0]]||{Ninguna:1})];
        x.energia=peso(tp==='comida'?{Normal:45,Baja:15,Alta:10,'Sueño':30}:{Normal:55,Baja:20,Alta:15,'Sueño':10});
        if(rnd()<.7)x.saciedad=peso(SAC[tp]||{'Con hambre':20,Bien:60,'Me he pasado':20});
        if(x.saciedad==='Me he pasado'&&rnd()<.4)x.sintomas=['Hinchazón'];
      }
      if(rnd()<.6)x.lugar=tp==='comida'&&!casa&&!finde?'Trabajo':finde&&rnd()<.3?'Fuera':'Casa';
      const etq=[];
      if(reunion||(martes&&tp==='comida'&&rnd()<.3))etq.push('Reunión jefe');
      if(casa&&(tp==='comida'||tp==='desayuno')){etq.push('Trabajo en casa');x.lugar='Casa';}
      if(dow===6&&tp==='cena'&&celebracion<2&&rnd()<.5){celebracion++;etq.push('Celebración');x.emoAntes=['Felicidad'];x.emoDespues=['Felicidad'];x.saciedad='Me he pasado';}
      if(etq.length)x.etiquetas=etq;
      add(off,x);
    });
    if(rnd()<.5)d.dias[iso(addDays(t,off))]={agua:.25*Math.round(4+rnd()*6),suenoHoras:.5*Math.round(12+rnd()*4),suenoCalidad:peso({Buena:50,Regular:35,Mala:15}),ejemplo:true};
  }
  d.dias[iso(addDays(t,-1))]={agua:1.5,actividadHoras:.75,actividad:'Carrera suave',suenoHoras:6.5,suenoCalidad:'Regular',reflexiones:'Cuando estoy frustrado como más rápido.',predominantes:'Trabajo, prisas',orgullo:'He salido a correr aunque estaba cansado',gratitud:'La cena tranquila en casa',ejemplo:true};
  return d;
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=(n,c)=>'<svg class="ico'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const byDay=f=>Object.values(data.ingestas).filter(x=>x.fecha===f).sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99'));
const countDay=f=>Object.values(data.ingestas).reduce((n,x)=>n+(x.fecha===f),0);
/* Completa (D16): dónde, pantalla y etiquetas son contexto y no cuentan como «antes». */
const hasAfter=x=>x.emoDespues.length||x.emoDespuesOtra||x.pensDespues||x.saciedad||x.energia||x.sintomas.length||x.sintomasOtros;
const hasBefore=x=>x.hambre||x.emoAntes.length||x.emoAntesOtra||x.pensAntes;
const completa=x=>!!(x.alimentos&&hasBefore(x)&&hasAfter(x));
function ingVacia(){return {hambre:'',lugar:'',pantalla:'',emoAntes:[],emoAntesOtra:'',pensAntes:'',emoDespues:[],emoDespuesOtra:'',pensDespues:'',saciedad:'',energia:'',energiaOtro:'',sintomas:[],sintomasOtros:'',etiquetas:[]};}
/* Etiquetas (D16): texto libre por ingesta. Dos con la misma clave (sin tildes ni
   mayúsculas) son la misma. No hay lista aparte: el catálogo sale de las ingestas. */
const ETQ_MAX=5,ETQ_LARGO=30;
const limpiarEtq=t=>String(t||'').replace(/\s+/g,' ').trim().slice(0,ETQ_LARGO).trim();
const claveEtq=t=>limpiarEtq(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function catalogoEtq(){
  const m=new Map();
  Object.values(data.ingestas).forEach(x=>(x.etiquetas||[]).forEach(t=>{const k=claveEtq(t);if(!k)return;const c=m.get(k);if(c)c.usos++;else m.set(k,{nombre:t,clave:k,usos:1});}));
  return [...m.values()].sort((a,b)=>b.usos-a.usos||a.nombre.localeCompare(b.nombre,'es'));
}
const fmtNum=n=>String(Math.round(n*100)/100).replace('.',',');
function fmtHoras(n){if(!n)return '0 h';const h=Math.floor(n),m=Math.round((n-h)*60);return (h?h+' h':'')+(h&&m?' ':'')+(m?m+' min':'');}
/* Las copias version 1 guardaban el agua como texto ("1,5 litros") y la actividad
   sólo como texto ("Carrera 40 min"). Se saca el número si lo hay; si no, el texto
   se conserva para no perder nada. */
function normDia(di){
  if(typeof di.agua==='string'){const m=di.agua.match(/\d+(?:[.,]\d+)?/);if(m){di.agua=Number(m[0].replace(',','.'));}else{di.aguaTexto=di.agua;delete di.agua;}}
  if(di.actividad&&di.actividadHoras==null){
    const h=di.actividad.match(/(\d+(?:[.,]\d+)?)\s*h/i),mi=di.actividad.match(/(\d+)\s*min/i);
    const v=(h?Number(h[1].replace(',','.')):0)+(mi?Number(mi[1])/60:0);
    if(v){di.actividadHoras=Math.round(v*4)/4;const r=di.actividad.replace(/\d+(?:[.,]\d+)?\s*h\b/i,'').replace(/\d+\s*min\b/i,'').replace(/\s+/g,' ').trim();if(r)di.actividad=r;else delete di.actividad;}
  }
  return di;
}
function normData(d){
  Object.keys(d.ingestas).forEach(k=>{d.ingestas[k]=Object.assign(ingVacia(),d.ingestas[k]);});
  d.dias=d.dias||{};Object.values(d.dias).forEach(normDia);
  if(!Array.isArray(d.etiquetasDistintas))d.etiquetasDistintas=[];
  return d;
}
const lower=v=>v?v.toLowerCase():'';
const hambreTxt=v=>({'Sí':'Con hambre','Algo':'Algo de hambre','No':'Sin hambre'})[v]||'';
const pantallaTxt=v=>v==='Sí'?'con pantalla':v==='No'?'sin pantalla':'';
const contextoTxt=x=>[x.lugar,pantallaTxt(x.pantalla)].filter(Boolean).join(' · ');
/* Filas del cierre del día, en el orden de la plantilla: [clave, etiqueta corta, etiqueta larga, texto]. */
function cierreRows(di){
  const act=[di.actividadHoras!=null?fmtHoras(di.actividadHoras):'',di.actividad||''].filter(Boolean).join(' · ');
  const sue=[di.suenoHoras!=null?fmtHoras(di.suenoHoras):'',lower(di.suenoCalidad)].filter(Boolean).join(' · ');
  return [
    ['agua','Agua','Agua',di.agua!=null?fmtNum(di.agua)+' l':(di.aguaTexto||'')],
    ['actividad','Actividad física','Actividad física',act],
    ['sueno','Sueño','Sueño de anoche',sue],
    ['reflexiones','Me he dado cuenta de','¿De qué me he dado cuenta?',di.reflexiones||''],
    ['predominantes','Pensamientos predominantes','Pensamientos predominantes',di.predominantes||''],
    ['orgullo','Orgullo','¿Qué me hace sentir orgullo hoy?',di.orgullo||''],
    ['gratitud','Gratitud','¿Qué puedo agradecer hoy?',di.gratitud||'']
  ];
}
const emoList=(arr,otra)=>arr.filter(e=>e!=='Otra').concat(otra?[otra]:[]);

const weekRange=m=>{const s=addDays(m,6);return m.getDate()+(m.getMonth()!==s.getMonth()?' '+mes3(m):'')+' – '+s.getDate()+' '+mes3(s);};

/* Orden de la línea (§3.4): lo registrado por hora; cada hueco de una principal va antes de
   la primera principal registrada de un tipo posterior (si no hay, al final); "+ Picoteo
   entre horas" una sola vez, debajo de la última ingesta; el cierre, siempre el último. */
function lineaDia(items){
  const used=new Set(items.map(x=>x.tipo));
  const huecos={};
  PRINCIPALES.filter(t=>!used.has(t)).forEach(t=>{
    const ti=PRINCIPALES.indexOf(t);
    let at=items.findIndex(x=>PRINCIPALES.indexOf(x.tipo)>ti);
    if(at<0)at=items.length;
    (huecos[at]=huecos[at]||[]).push(t);
  });
  let h='';
  for(let i=0;i<=items.length;i++){
    (huecos[i]||[]).forEach(t=>{h+=gapItem(t);});
    if(i<items.length){
      h+=ingItem(items[i]);
      if(i===items.length-1)h+='<button class="piclink" data-new="picoteo">+ Picoteo entre horas</button>';
    }
  }
  return h+cierreItem();
}
function gapItem(t){
  return '<div class="ti t-'+t+'"><span class="dot d-gap">'+ico(t)+'</span><button class="gapc" data-new="'+t+'"><span><b>'+TIPO_LBL[t]+'</b> sin registrar</span><span class="plus" aria-hidden="true">+</span></button></div>';
}
function halfHtml(x,lado){

    return '<div class="half a"><h5>Antes</h5>'+(a.length?'<div class="emos">'+esc(a.join(' · '))+'</div>':'')+(x.pensAntes?'<div class="th">«'+esc(x.pensAntes)+'»</div>':'')+(ctx?'<div class="meta">'+esc(ctx)+'</div>':'')+'</div>';
  }
  const d=emoList(x.emoDespues,x.emoDespuesOtra),en=x.energia==='Otro'?x.energiaOtro:x.energia;
  const sint=x.sintomas.filter(s=>s!=='Otros').concat(x.sintomasOtros?[x.sintomasOtros]:[]);
  const m=[lower(x.saciedad),en?'energía '+en.toLowerCase():'',sint.join(', ').toLowerCase()].filter(Boolean).join(' · '),meta=m?cap(m):'';

}
function ingItem(x){
  const ha=hasBefore(x),hd=hasAfter(x),hora=x.hora||'sin hora',lbl=TIPO_LBL[x.tipo];

      +'<div class="food">'+esc(x.alimentos)+'</div><div class="cmeta">'+esc((a||'—')+' → '+(d||'—')+(en?' · energía '+en.toLowerCase():'')+(x.saciedad?' · '+lower(x.saciedad):''))+'</div></button></div>';
  }
  const tag=!ha&&!hd?'Falta el antes y el después':!hd?'Falta el después':!ha?'Falta el antes':'Faltan los alimentos';
  const add=(lado,part)=>'<button class="half add '+lado+'" data-edit="'+x.id+'" data-part="'+part+'" aria-label="Añadir el '+part+' de '+esc(lbl)+'"><h5>'+(part==='antes'?'Antes':'Después')+'</h5>+ Añadir</button>';
  return '<div class="ti t-'+x.tipo+'"><span class="dot d-half">'+ico(x.tipo)+'</span><div class="card open">'
    +'<button class="hit" data-edit="'+x.id+'" aria-label="Editar '+esc(lbl+' '+hora)+'"></button><div class="body">'
    +head+'<span class="tag">'+tag+'</span></div>'
    +'<div class="food'+(x.alimentos?'':' none')+'">'+esc(x.alimentos||'Sin alimentos anotados')+'</div>'
    +'<div class="halves">'+(ha?halfHtml(x,'a'):add('a','antes'))+(hd?halfHtml(x,'d'):add('d','despues'))+'</div>'
    +(x.etiquetas.length?'<div class="etqs">'+x.etiquetas.map(t=>'<span class="etqchip"># '+esc(t)+'</span>').join('')+'</div>':'')+'</div></div></div>';

function cierreItem(){
  const di=data.dias[ui.cursor]||{},tiene=Object.keys(di).length>0;

  if(di.actividadHoras!=null)res.push('Actividad '+fmtHoras(di.actividadHoras));else if(di.actividad)res.push(di.actividad);

function renderMes(){
  const c=parse(ui.calCursor),y=c.getFullYear(),mo=c.getMonth(),last=new Date(y,mo+1,0);
  const semHoy=iso(mondayOf(parse(TODAY)));
  let h='<section class="calcard"><div class="cal-nav"><button class="arrow" data-cm="-1" aria-label="Mes anterior">‹</button><h2>'+cap(MESES[mo])+' <span>'+y+'</span></h2><button class="arrow" data-cm="1" aria-label="Mes siguiente">›</button></div>';
  h+='<div class="mgrid"><div class="dow">Sem</div>'+DOW.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let m=mondayOf(new Date(y,mo,1));m<=last;m=addDays(m,7)){
    h+='<div class="wkn'+(iso(m)===semHoy?' now':'')+'">'+isoWeek(m)+'</div>';
    for(let i=0;i<7;i++){
      const d=addDays(m,i),f=iso(d);

/* Qué se exporta: un alcance (día, semana, mes o año) alrededor de un día de referencia. */
let exp={scope:'dia',ref:TODAY};
function rangeDays(){
  const c=parse(exp.ref),out=[];
  if(exp.scope==='dia')return [exp.ref];
  if(exp.scope==='semana'){const m=mondayOf(c);for(let i=0;i<7;i++)out.push(iso(addDays(m,i)));return out;}
  if(exp.scope==='mes'){const n=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();for(let d=1;d<=n;d++)out.push(iso(new Date(c.getFullYear(),c.getMonth(),d)));return out;}
  for(let d=new Date(c.getFullYear(),0,1);d.getFullYear()===c.getFullYear();d=addDays(d,1))out.push(iso(d));return out;
}
function rangeTitle(){
  const c=parse(exp.ref);
  if(exp.scope==='dia')return cap(longDate(exp.ref))+' de '+c.getFullYear();
  if(exp.scope==='semana'){const m=mondayOf(c),s=addDays(m,6);return 'Semana del '+m.getDate()+' de '+MESES[m.getMonth()]+' al '+s.getDate()+' de '+MESES[s.getMonth()]+' de '+s.getFullYear();}
  if(exp.scope==='mes')return cap(MESES[c.getMonth()])+' de '+c.getFullYear();
  return 'Año '+c.getFullYear();
}
function rangeLabel(){
  const c=parse(exp.ref);
  if(exp.scope==='dia')return cap(longDate(exp.ref));
  if(exp.scope==='semana'){const m=mondayOf(c);return 'Semana '+isoWeek(m)+' · '+weekRange(m);}
  if(exp.scope==='mes')return cap(MESES[c.getMonth()])+' '+c.getFullYear();
  return String(c.getFullYear());
}
const enOf=x=>x.energia==='Otro'?x.energiaOtro:x.energia;
const sintOf=x=>x.sintomas.filter(v=>v!=='Otros').concat(x.sintomasOtros?[x.sintomasOtros]:[]);
function dayFull(f,lvl){
  const h='#'.repeat(lvl),L=[h+' '+cap(longDate(f)),''];
  byDay(f).forEach(x=>{
    L.push(h+'# '+TIPO_LBL[x.tipo]+' · '+(x.hora||'sin hora'));
    L.push('- Alimentos: '+(x.alimentos||'—'));
    if(x.hambre)L.push('- Hambre antes: '+x.hambre);
    if(contextoTxt(x))L.push('- Dónde: '+contextoTxt(x));
    L.push('- Antes: '+(emoList(x.emoAntes,x.emoAntesOtra).join(', ')||'—')+(x.pensAntes?' · «'+x.pensAntes+'»':''));
    L.push('- Después: '+(emoList(x.emoDespues,x.emoDespuesOtra).join(', ')||'—')+(x.pensDespues?' · «'+x.pensDespues+'»':''));
    if(x.saciedad)L.push('- Cómo me he quedado: '+x.saciedad);
    if(enOf(x))L.push('- Energía: '+enOf(x));
    if(sintOf(x).length)L.push('- Síntomas: '+sintOf(x).join(', '));
    if(x.etiquetas.length)L.push('- Etiquetas: '+x.etiquetas.join(', '));
    L.push('');
  });
  const di=data.dias[f]||{};
  const c=cierreRows(di).filter(r=>r[3]);
  if(c.length){L.push(h+'# Cierre del día');c.forEach(([,l,,v])=>L.push('- '+l+': '+v));L.push('');}
  return L.join('\n');
}
function dayShort(f){
  const d=parse(f),L=[cap(DIAS[d.getDay()].slice(0,3))+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)];
  byDay(f).forEach(x=>{
    let t='  '+(x.hora||'--:--')+' '+TIPO_LBL[x.tipo]+' — '+(x.alimentos||'—');
    const a=emoList(x.emoAntes,x.emoAntesOtra).join(', '),dd=emoList(x.emoDespues,x.emoDespuesOtra).join(', ');
    /* D16: «con hambre» puede ser de antes o de después, así que los dos llevan el momento delante. */
    if(x.hambre)t+=' | antes '+lower(hambreTxt(x.hambre));
    if(contextoTxt(x))t+=' | '+lower(contextoTxt(x));
    if(a||dd)t+=' | '+(a||'—')+' → '+(dd||'—');
    if(x.saciedad)t+=' | después '+lower(x.saciedad);
    if(enOf(x))t+=' | energía '+enOf(x).toLowerCase();
    if(sintOf(x).length)t+=' | '+sintOf(x).join(', ').toLowerCase();
    if(x.etiquetas.length)t+=' | '+x.etiquetas.map(e=>'#'+e.toLowerCase()).join(' ');
    L.push(t);
  });
  const di=data.dias[f]||{};
  const c=cierreRows(di).filter(r=>r[3]).map(([,l,,v])=>l+': '+v);
  if(c.length)L.push('  Cierre: '+c.join(' · '));
  return L.join('\n');
}

function exportText(fmt){

/* ---------- guardar archivos ----------
   Dentro de Claude.ai, su función de descargas. Fuera (GitHub Pages, la PWA): en el móvil,
   la hoja de compartir del sistema ("Guardar en Archivos"); si no la hay o no acepta el
   archivo, una descarga normal. "Copiar como texto" sigue siempre como alternativa. */
async function getDownloader(){
  try{const d=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);if(d)return d;}catch(e){}
  return {save:saveLocal};
}
async function saveLocal({filename,data}){
  const type=/\.json$/.test(filename)?'application/json':/\.csv$/.test(filename)?'text/csv':'text/plain';
  const blob=new Blob([data],{type:type+';charset=utf-8'});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare){
    const file=new File([blob],filename,{type});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return;}
      catch(e){if(e&&e.name==='AbortError'){const x=new Error('declined');x.code='declined';throw x;}}
    }
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function saveExport(){
  const dl=await getDownloader();
  if(!dl){toast('Aquí no se puede guardar el archivo: usa Copiar');return;}
  const ext=expFmt==='tabla'?'csv':expFmt==='resumido'?'txt':'md';
  const name='comida-app-'+exp.scope+'-'+exp.ref+'.'+ext;
  try{await dl.save({filename:name,data:(ext==='csv'?'﻿':'')+$('expTxt').value});toast('Archivo guardado');}
  catch(e){if(!(e&&e.code==='declined'))toast('No se ha podido guardar: usa Copiar');}
}

function parseImport(text){
  try{
    const o=JSON.parse(String(text).trim());
    if(!o||o.app!=='comida-app'||!Array.isArray(o.ingestas))throw 0;
    const m=mergeImport(o),fecha=esc(new Date(o.exportado).toLocaleDateString('es-ES'));

    pendingImport=m;
    const q=[];if(m.nuevas)q.push('<b>'+pl(m.nuevas,'comida nueva','comidas nuevas')+'</b>');if(m.completadas)q.push('huecos en <b>'+pl(m.completadas,'comida','comidas')+'</b>');if(m.dias)q.push('<b>'+pl(m.dias,'cierre de día','cierres de día')+'</b>');if(m.nombre)q.push('tu nombre');

  }catch(e){$('importMsg').innerHTML='<p class="status" style="color:var(--danger)">Eso no es una copia de Comida App. Usa el archivo .json o el texto completo que guardaste desde «Guardar copia».</p>';}

/* Fusionar (decidido el 24-09-2026): lo que no está se añade y lo que está en blanco se
   rellena; lo que ya tiene datos en este móvil no se toca. Se prepara sobre una copia de
   los datos y sólo se guarda al confirmar. El nombre, igual: solo si aquí no hay. */
const vacio=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
function rellenar(cur,inc){
  let n=0;
  Object.keys(inc).forEach(k=>{if(k==='id'||k==='ejemplo')return;if(vacio(cur[k])&&!vacio(inc[k])){cur[k]=inc[k];n++;}});
  if(cur.aguaTexto&&cur.agua!=null){delete cur.aguaTexto;}
  return n;
}
function mergeImport(o){
  const next=JSON.parse(JSON.stringify(data));
  if(next.ejemplos){
    Object.keys(next.ingestas).forEach(k=>{if(next.ingestas[k].ejemplo)delete next.ingestas[k];});
    Object.keys(next.dias).forEach(k=>{if(next.dias[k].ejemplo)delete next.dias[k];});
    next.ejemplos=false;
  }
  let nuevas=0,completadas=0,dias=0;
  o.ingestas.forEach(x=>{
    if(!x||!x.id||!x.fecha)return;
    const inc=Object.assign(ingVacia(),x);delete inc.ejemplo;
    const cur=next.ingestas[x.id];
    if(!cur){next.ingestas[x.id]=inc;nuevas++;}
    else if(rellenar(cur,inc))completadas++;
  });
  Object.entries(o.dias||{}).forEach(([f,di])=>{
    const inc=normDia(Object.assign({},di));delete inc.ejemplo;
    if(!next.dias[f]){if(Object.keys(inc).length){next.dias[f]=inc;dias++;}}
    else if(rellenar(next.dias[f],inc))dias++;
  });
  if(o.exportado&&(!next.ultimaCopia||o.exportado>next.ultimaCopia))next.ultimaCopia=o.exportado;
  /* Las etiquetas se rellenan solo si aquí la lista está vacía (rellenar): no se mezclan listas. */
  const par=p=>Array.isArray(p)&&p.length===2?p.map(String).sort():null;
  const vistas=new Set((next.etiquetasDistintas||[]).map(p=>JSON.stringify(par(p))));
  next.etiquetasDistintas=(next.etiquetasDistintas||[]).slice();
  (Array.isArray(o.etiquetasDistintas)?o.etiquetasDistintas:[]).map(par).filter(Boolean).forEach(p=>{const k=JSON.stringify(p);if(!vistas.has(k)){vistas.add(k);next.etiquetasDistintas.push(p);}});
  const nom=o.perfil&&typeof o.perfil.nombre==='string'?o.perfil.nombre.trim().slice(0,30):'';
  const nombre=!perfil.nombre&&nom?nom:'';
  return {next,nuevas,completadas,dias,nombre};
}
function doImport(){
  data=pendingImport.next;
  if(pendingImport.nombre){perfil.nombre=pendingImport.nombre;savePerfil();}
  save();pendingImport=null;close();render();toast('Copia recuperada');
}

/* ---------- PIN (D14) ----------
   Nivel 1: tapa la app, no cifra los datos (el cifrado es el banco de ideas §4.5).
   PBKDF2-SHA-256 con Web Crypto: solo existe en https o localhost, no en file://. */
const PIN_ITER=150000,FALLOS_MAX=5,ESPERA_MS=30000,FUERA_MS=5*60*1000;
const hayCrypto=()=>!!(window.crypto&&crypto.subtle);
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derivar(pin,salt,iter){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256));
}
async function crearPin(pin){const salt=crypto.getRandomValues(new Uint8Array(16));return {salt:b64(salt),hash:await derivar(pin,salt,PIN_ITER),iter:PIN_ITER};}
async function pinCorrecto(pin){const p=perfil.pin;return !!p&&(await derivar(pin,unb64(p.salt),p.iter))===p.hash;}

/* Teclado: un solo teclado activo a la vez (el del bloqueo o el de un flujo). */
let teclado=null;
const padHtml=()=>'<div class="dots" id="pinDots" role="status" aria-live="polite" aria-label="0 de 4"><i></i><i></i><i></i><i></i></div><div class="pinmsg" id="pinMsg"></div>'
  +'<div class="pad" id="pinPad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-key="'+n+'" aria-label="'+n+'">'+n+'</button>').join('')
  +'<span></span><button type="button" data-key="0" aria-label="0">0</button><button type="button" class="del" data-key="del" aria-label="Borrar">'+ico('borrar')+'</button></div>';
function padStart(cb,msg,ok){teclado={buf:'',busy:false,cb};pintarPad();if(msg)pinMsg(msg,ok);}
function pintarPad(){
  const d=$('pinDots');if(!d||!teclado)return;
  [...d.children].forEach((i,k)=>i.classList.toggle('on',k<teclado.buf.length));
  d.setAttribute('aria-label',teclado.buf.length+' de 4');
}
function pinMsg(t,ok){const m=$('pinMsg');if(m){m.textContent=t||'';m.classList.toggle('ok',!!ok);}}
function padKey(k){
  if(!teclado||teclado.busy||esperando())return;
  if(k==='del')teclado.buf=teclado.buf.slice(0,-1);else if(teclado.buf.length<4)teclado.buf+=k;
  pintarPad();
  if(teclado.buf.length===4){teclado.busy=true;const v=teclado.buf;Promise.resolve(teclado.cb(v)).catch(()=>padFallo('No se ha podido comprobar el PIN'));}
}
function padFallo(msg){
  const d=$('pinDots');
  if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
  pinMsg(msg);
  setTimeout(()=>{if(!teclado)return;teclado.buf='';teclado.busy=false;pintarPad();},350);
}

/* Bloqueo */
let bloqueada=false,salida=0,esperaTimer=null;
const esperando=()=>bloqueada&&perfil.esperaHasta>Date.now();
function bloquear(){
  if(!perfil.pin)return;
  bloqueada=true;document.body.classList.add('locked');document.body.classList.remove('veil');
  const L=$('lock');L.hidden=false;
  L.innerHTML='<div class="pinbox"><div class="lk">'+ico('candado')+'</div><h1>'+(perfil.nombre?'Hola, '+esc(perfil.nombre):'Hola')+'</h1>'
    +(hayCrypto()?padHtml()+'<button class="pinlink" id="forgotBtn">¿Has olvidado el PIN?</button><div id="forgotBox"></div>'
      :'<p>Para desbloquearla, abre la app desde su dirección https (GitHub Pages).</p>')+'</div>';
  if(hayCrypto()){padStart(desbloquearCon);tickEspera();}
}
async function desbloquearCon(pin){
  if(await pinCorrecto(pin)){
    perfil.fallos=0;perfil.esperaHasta=0;savePerfil();
    bloqueada=false;teclado=null;document.body.classList.remove('locked');$('lock').hidden=true;$('lock').innerHTML='';render();
    return;
  }
  perfil.fallos=(perfil.fallos||0)+1;
  if(perfil.fallos>=FALLOS_MAX){perfil.fallos=0;perfil.esperaHasta=Date.now()+ESPERA_MS;}
  savePerfil();padFallo('PIN incorrecto');tickEspera();
}
/* Tras 5 fallos seguidos, 30 s sin teclado y con cuenta atrás. Sobrevive a recargar. */
function tickEspera(){
  clearInterval(esperaTimer);
  const paint=()=>{
    const w=esperando(),left=Math.ceil((perfil.esperaHasta-Date.now())/1000);
    document.querySelectorAll('#pinPad button').forEach(b=>b.disabled=w);
    if(w)pinMsg('Espera '+left+' s');
    else{clearInterval(esperaTimer);if($('pinMsg')&&/^Espera/.test($('pinMsg').textContent))pinMsg('');}
  };
  paint();if(esperando())esperaTimer=setInterval(paint,1000);
}

  location.reload();
}
document.addEventListener('visibilitychange',()=>{
  if(!perfil.pin)return;
  if(document.visibilityState==='hidden'){
    salida=Date.now();
    if(perfil.bloqueo==='salir')bloquear();else if(!bloqueada)document.body.classList.add('veil');
  }else if(!bloqueada){
    if(perfil.bloqueo==='salir'||Date.now()-salida>FUERA_MS)bloquear();
    else document.body.classList.remove('veil');
  }
});

/* Flujos de Tu espacio: activar, cambiar y quitar. */
let flujo=null;
function openPinFlow(mode){
  if(!hayCrypto()){toast('El PIN necesita la app publicada (https)');return;}
  flujo={mode,first:''};
  pasoPin(mode==='activar'?(perfil.nombre?'elegir':'nombre'):'actual');
}
function pasoPin(step,msg,ok){
  flujo.step=step;teclado=null;
  const tit={activar:'Activar PIN',cambiar:'Cambiar PIN',quitar:'Quitar PIN'}[flujo.mode];
  let body='';
  if(step==='nombre')body='<h2>¿Cómo te llamas?</h2><p>Saldrá al abrir la app.</p><div class="field" style="width:100%;text-align:left"><label for="f-pnombre">Tu nombre</label><input type="text" id="f-pnombre" maxlength="30" autocomplete="given-name"></div><button class="btn primary" id="pinNombreOk">Seguir</button>';
  else if(step==='aviso')body='<h2>Antes de activarlo</h2><div class="pinwarn">Si olvidas el PIN, la única forma de entrar es borrar los datos de este móvil y recuperar una copia. Guarda una copia antes.</div>'
    +'<p class="pin-st">'+esc(ultimaCopiaTxt())+'</p><div class="row2" style="justify-content:center"><button class="btn sec" id="pinCopia">'+ico('descarga')+'Guardar copia ahora</button><button class="btn primary" id="pinActivar">Activar</button></div>';
  else body='<h2>'+{actual:'Escribe tu PIN actual',elegir:'Elige un PIN de 4 cifras',repetir:'Repítelo'}[step]+'</h2>'+padHtml();
  $('overlay').innerHTML='<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab" aria-hidden="true"></div><div class="sheet-in">'
    +'<div class="sheet-head"><button type="button" class="btn ghost" id="pinCancel">Cancelar</button><h3 id="sh-t">'+tit+'</h3><span class="sp"></span></div>'
    +'<div class="pinbox" style="margin:8px auto 12px">'+body+'</div></div></div>';
  document.body.style.overflow='hidden';
  if(step==='nombre')$('f-pnombre').focus();
  if(step==='actual')padStart(async pin=>{
    if(!(await pinCorrecto(pin))){padFallo('PIN incorrecto');return;}
    if(flujo.mode==='quitar'){perfil.pin=null;perfil.fallos=0;perfil.esperaHasta=0;savePerfil();finPin('PIN quitado');}
    else pasoPin('elegir');
  },msg,ok);
  if(step==='elegir')padStart(pin=>{flujo.first=pin;pasoPin('repetir');},msg,ok);
  if(step==='repetir')padStart(async pin=>{
    if(pin!==flujo.first){flujo.first='';pasoPin('elegir','No coinciden. Vuelve a elegirlo');return;}
    if(flujo.mode==='activar'){pasoPin('aviso');return;}
    perfil.pin=await crearPin(pin);savePerfil();finPin('PIN cambiado');
  },msg,ok);
}
function finPin(msg){flujo=null;teclado=null;openMe();toast(msg);}
/* "Guardar copia ahora" sin salir del flujo; si el móvil no deja descargar, la hoja de copia. */
async function copiaDesdeAviso(){
  const dl=await getDownloader();
  try{await dl.save({filename:'comida-app-copia-'+TODAY+'.json',data:backupJson()});data.ultimaCopia=new Date().toISOString();save();toast('Copia guardada');pasoPin('aviso');}
  catch(e){if(e&&e.code==='declined')return;flujo=null;openBackup('guardar');}
}

function close(){$('overlay').innerHTML='';document.body.style.overflow='';draft=null;if(!bloqueada){flujo=null;teclado=null;}}
let tt;function toast(m){clearTimeout(tt);$('toastHost').innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';tt=setTimeout(()=>$('toastHost').innerHTML='',1800);}
function moverSemana(s){ui.cursor=iso(addDays(parse(ui.cursor),7*s));render();}
function irA(f){ui.sec='hoy';ui.cursor=f;saveUi();render();window.scrollTo(0,0);}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.dataset.key){padKey(t.dataset.key);return;}
  if(t.dataset.pinflow){openPinFlow(t.dataset.pinflow);return;}
  if(t.dataset.bloqueo){perfil.bloqueo=t.dataset.bloqueo;savePerfil();document.querySelectorAll('[data-bloqueo]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return;}
  if(t.id==='pinCancel'){flujo=null;teclado=null;openMe();return;}
  if(t.id==='pinNombreOk'){const v=$('f-pnombre').value.replace(/\s+/g,' ').trim();if(!v){$('f-pnombre').focus();toast('Escribe tu nombre para seguir');return;}setNombre(v);pasoPin('elegir');return;}
  if(t.id==='pinCopia'){copiaDesdeAviso();return;}
  if(t.id==='pinActivar'){t.disabled=true;crearPin(flujo.first).then(pn=>{perfil.pin=pn;perfil.fallos=0;perfil.esperaHasta=0;savePerfil();finPin('PIN activado');});return;}
  if(t.id==='forgotBtn'){$('forgotBox').innerHTML='<div class="forgot"><span>Sin el PIN no se pueden ver los datos. Puedes borrar todo lo de este móvil y recuperar después tu última copia.</span><button class="btn danger" id="wipeBtn">Borrar todo y empezar</button></div>';return;}
  if(t.id==='wipeBtn'){if(t.classList.contains('armed'))borrarTodo();else{t.classList.add('armed');t.textContent='¿Seguro? Pulsa otra vez';}return;}
  if(t.dataset.sec){ui.sec=t.dataset.sec;if(ui.sec==='hoy')ui.cursor=ui.cursor||TODAY;saveUi();render();window.scrollTo(0,0);return;}
  if(t.dataset.wk){moverSemana(Number(t.dataset.wk));return;}
  if(t.dataset.cal){ui.cal=t.dataset.cal;saveUi();render();return;}
  if(t.dataset.cm){const c=parse(ui.calCursor);ui.calCursor=iso(new Date(c.getFullYear(),c.getMonth()+Number(t.dataset.cm),1));render();return;}
  if(t.dataset.cy){const c=parse(ui.calCursor);ui.calCursor=iso(new Date(c.getFullYear()+Number(t.dataset.cy),c.getMonth(),1));render();return;}
  if(t.id==='goToday'){ui.cursor=TODAY;render();return;}
  if(t.id==='fab'){openIngesta(null);return;}
  if(t.id==='exportBtn'){openExport();return;}
  if(t.id==='meBtn'){openMe();return;}
  if(t.id==='bannerBackup'){openBackup('guardar');return;}
  if(t.id==='snooze'){ui.posponer=TODAY;saveUi();render();return;}
  if(t.id==='saveBackup'){saveBackup();return;}
  if(t.id==='pickFile'){$('importFile').click();return;}
  if(t.id==='doImport'){doImport();return;}
  if(t.id==='cancelImport'){pendingImport=null;$('importMsg').innerHTML='';return;}
  if(t.dataset.edit){openIngesta(t.dataset.edit,null,t.dataset.part);return;}
  if(t.dataset.new){openIngesta(null,t.dataset.new);return;}
  if(t.dataset.day){ui.cursor=t.dataset.day;render();return;}
  if(t.dataset.goday){irA(t.dataset.goday);return;}
  if(t.dataset.month){ui.cal='mes';ui.calCursor=t.dataset.month;saveUi();render();window.scrollTo(0,0);return;}
  if(t.id==='editDay'){openDay();return;}
  if(t.dataset.fmt){expFmt=t.dataset.fmt;try{localStorage.setItem(STORE+'-fmt',expFmt);}catch(e){}fillExport();return;}
  if(t.dataset.scope){exp.scope=t.dataset.scope;fillExport();return;}
  if(t.id==='saveExport'){saveExport();return;}
  if(t.dataset.bk){openBackup(t.dataset.bk);return;}
  if(t.id==='showBackupText'){showBackupText();return;}
  if(t.id==='loadTxt'){const v=$('importTxt').value;if(!v.trim()){toast('Pega primero el texto de la copia');return;}parseImport(v);return;}
  if(t.id==='clearEx'){
    if(t.dataset.armed){data={ingestas:{},dias:{},ejemplos:false,etiquetasDistintas:[],ultimaCopia:data.ultimaCopia||null};save();render();toast('Listo: empiezas en blanco');}
    else{t.dataset.armed='1';t.textContent='¿Seguro? Pulsa otra vez';}
    return;
  }
  if(t.id==='delBtn'){
    if(t.classList.contains('armed')){delete data.ingestas[draft.id];save();close();render();toast('Registro borrado');}
    else{t.classList.add('armed');t.textContent='Pulsa otra vez para borrar';}
    return;
  }
  if(t.id==='copyBtn'){
    const ta=$('expTxt');
    const fallback=()=>{ta.focus();ta.select();toast('Texto seleccionado: cópialo');};
    try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado'),fallback);}catch(err){fallback();}
    return;
  }
  if(t.hasAttribute('data-close')){close();return;}
  if(t.dataset.etqdel){draft.etiquetas.splice(Number(t.dataset.etqdel),1);pintarEtq();resumenForm();return;}
  if(t.dataset.etqadd){addEtq(t.dataset.etqadd,!!t.dataset.foco);return;}
  const stp=t.closest('.step');
  if(stp){stepBy(stp.dataset.step,t.hasAttribute('data-inc')?1:-1);return;}
  const box=t.parentElement&&t.parentElement.dataset.pick?t.parentElement:null;
  if(box){
    const multi=box.dataset.multi==='1',v=t.dataset.v,on=t.getAttribute('aria-pressed')==='true';
    if(!multi){box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));t.setAttribute('aria-pressed',String(box.dataset.pick==='tipo'?true:!on));}
    else{
      if(v==='Ninguna'&&!on)box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
      else if(v!=='Ninguna'){const n=box.querySelector('[data-v="Ninguna"]');if(n)n.setAttribute('aria-pressed','false');}
      t.setAttribute('aria-pressed',String(!on));
    }
    const name=box.dataset.pick,sel=readPick(name);
    const map={emoAntes:['emoAntesOtra','Otra'],emoDespues:['emoDespuesOtra','Otra'],energia:['energiaOtro','Otro'],sintomas:['sintomasOtros','Otros']};
    if(map[name]){const f=document.querySelector('[data-other="'+map[name][0]+'"]');f.hidden=!sel.includes(map[name][1]);if(!f.hidden)f.querySelector('input').focus();}
    resumenForm();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-etq'){sugIx=0;pintarSug();return;}
  if(e.target.closest('#fIng'))resumenForm();
});
/* Deslizar la tira de la semana cambia de semana. */
let sw=null;
document.addEventListener('touchstart',e=>{sw=e.target.closest('#week')?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw)return;const dx=e.changedTouches[0].clientX-sw.x,dy=e.changedTouches[0].clientY-sw.y;sw=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5)moverSemana(dx<0?1:-1);
},{passive:true});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'&&e.target.files[0])readImport(e.target.files[0]);
  if(e.target.id==='f-nombre')setNombre(e.target.value);
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fIng')saveIngesta();if(e.target.id==='fDay')saveDay();});
document.addEventListener('keydown',e=>{
  if(teclado&&$('pinPad')&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();padKey(e.key);return;}
    if(e.key==='Backspace'){e.preventDefault();padKey('del');return;}
  }
  if(bloqueada)return;
  /* Etiquetas: Intro añade la sugerencia resaltada (o crea) y no envía el formulario. */
  if(e.target.id==='f-etq'){
    const it=sugerencias();
    if(e.key==='Enter'){e.preventDefault();if(it&&it.length)addEtq(it[sugIx].nuevo||it[sugIx].nombre,true);return;}
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&it&&it.length){e.preventDefault();sugIx=(sugIx+(e.key==='ArrowDown'?1:it.length-1))%it.length;pintarSug();return;}
  }
  if(e.key==='Enter'&&e.target.id==='f-pnombre'){e.preventDefault();$('pinNombreOk').click();return;}
  if(e.key==='Escape'&&$('overlay').innerHTML){const n=$('f-nombre');if(n)setNombre(n.value);close();}
  if(e.key==='Enter'&&e.target.id==='f-nombre'){e.preventDefault();e.target.blur();}
});

render();
if(perfil.pin)bloquear();
})();
</script>
